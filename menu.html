<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCord - Menu Principal</title>
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/1462160007893356677/1550983855110881342/favicon.png?ex=6ab051c6&is=6aaf0046&hm=f3ba9699012ec77de99484b014b5f72310a58bc2cf999de20076e56dc2d4bfdc&">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #07080f;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .dashboard-card {
            background: #0b0f19;
            border: 1px solid #1e2235;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .user-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 36px;
            color: #fff;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        .brand-gradient {
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 45%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-submit {
            position: relative;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            transition: opacity 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 25px rgba(239, 68, 68, 0.4);
            margin-top: 20px;
        }

        .btn-submit:hover {
            opacity: 0.92;
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.6);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(59, 130, 246, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <div class="dashboard-card">
            <!-- Tela de Carregamento enquanto valida a sessão -->
            <div id="loading-view" class="loading-container">
                <div class="spinner"></div>
                <p style="color: #94a3b8; font-size: 16px;">A verificar sessão...</p>
            </div>

            <!-- Painel / Menu protegido -->
            <div id="dashboard-content" style="display: none;">
                <div class="user-avatar">⚡</div>
                <h3 style="font-size: 28px; margin-bottom: 4px;" id="dash-name">Bem-vindo!</h3>
                <p style="color: #38bdf8; font-size: 16px; font-weight: 600; margin-bottom: 8px;" id="dash-username">@usuário</p>
                <p style="color: #94a3b8; font-size: 15px; margin-bottom: 30px;">A sua conta está ativa e autenticada com sucesso no <span class="brand-gradient">StarCord</span>.</p>
                <button type="button" class="btn-submit" onclick="logout()">Terminar Sessão</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuKdQkPzGagnCIKUE5Yz_mKtpPw3OCf7c",
            authDomain: "starcord-14470.firebaseapp.com",
            projectId: "starcord-14470",
            storageBucket: "starcord-14470.firebasestorage.app",
            messagingSenderId: "154662528498",
            appId: "1:154662528498:web:ff9815bb21dc2b4172776b",
            measurementId: "G-QR4Y9ZHMF0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Se NÃO estiver logado, redireciona imediatamente para o login
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'www/login.html';
            } else {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    let name = "Usuário StarCord";
                    let username = "@starcord";

                    if (userDoc.exists()) {
                        name = userDoc.data().name || name;
                        username = userDoc.data().username || username;
                    }

                    document.getElementById('dash-name').textContent = name;
                    document.getElementById('dash-username').textContent = username;

                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('dashboard-content').style.display = 'block';
                } catch (error) {
                    console.error("Erro ao carregar dados do usuário:", error);
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('dashboard-content').style.display = 'block';
                }
            }
        });

        window.logout = async function() {
            try {
                await signOut(auth);
                window.location.href = 'www/login.html';
            } catch (error) {
                console.error("Erro ao terminar sessão:", error);
            }
        };
    </script>
</body>
</html>
